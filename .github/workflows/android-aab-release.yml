name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/android-aab-release.yml'

permissions:
  contents: read

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build signed Play Store AAB
        run: flutter build appbundle --release --build-name=1.0.54 --build-number=56

      - name: Build signed release APK
        run: flutter build apk --release --build-name=1.0.54 --build-number=56

      - name: Prepare release files
        run: |
          cp build/app/outputs/bundle/release/app-release.aab 'Fasakhansta-1.0.54-56.aab'
          cp build/app/outputs/flutter-apk/app-release.apk 'Fasakhansta-1.0.54-56.apk'

      - name: Upload Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fasakhansta-PlayStore-AAB-1.0.54-56
          path: Fasakhansta-1.0.54-56.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fasakhansta-APK-1.0.54-56
          path: Fasakhansta-1.0.54-56.apk
          if-no-files-found: error
          retention-days: 14
