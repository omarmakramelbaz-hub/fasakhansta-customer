name: Android APK Test Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/app/src/main/res/**'
      - 'android/app/google-services.json'

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Facebook login for Android
        env:
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('android/app/src/main/res/values/strings.xml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('[YOUR_FACEBOOK_APP_ID]', '997704678612295')
          text = text.replace('fb[YOUR_FACEBOOK_APP_ID]', 'fb997704678612295')

          token = os.environ.get('FACEBOOK_CLIENT_TOKEN', '').strip()
          if token:
              text = text.replace('[YOUR_FACEBOOK_CLIENT_TOKEN]', token)
              print('Facebook Android client token injected from repository secret.')
          else:
              print('::warning::FACEBOOK_CLIENT_TOKEN repository secret is not configured. Facebook login will remain unavailable in this APK until it is added.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Sync signing fingerprints with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FASAKHANINJATEST }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::Firebase service-account secret is unavailable; using the repository google-services.json as-is."
            exit 0
          fi

          python3 -m pip install --quiet --disable-pip-version-check google-auth requests

          STORE_PASSWORD="$(sed -n 's/^storePassword=//p' android/key.properties)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' android/key.properties)"
          KEYSTORE="android/app/FaskhaNinja-keystore.jks"

          SHA1="$(keytool -list -v -keystore "$KEYSTORE" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n1)"
          SHA256="$(keytool -list -v -keystore "$KEYSTORE" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1)"

          if [ -z "$SHA1" ] || [ -z "$SHA256" ]; then
            echo "::error::Could not read the release signing certificate fingerprints."
            exit 1
          fi

          export SHA1 SHA256

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          firebase_app_id = '1:224648167390:android:d4d87f98dfe5ddf556274f'
          service_account_info = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_JSON'])
          creds = service_account.Credentials.from_service_account_info(
              service_account_info,
              scopes=['https://www.googleapis.com/auth/cloud-platform'],
          )
          creds.refresh(Request())
          headers = {
              'Authorization': f'Bearer {creds.token}',
              'Content-Type': 'application/json',
          }

          parent = f'projects/-/androidApps/{firebase_app_id}'
          sha_url = f'https://firebase.googleapis.com/v1beta1/{parent}/sha'

          existing_response = requests.get(sha_url, headers=headers, timeout=60)
          existing_response.raise_for_status()
          existing = {
              item.get('shaHash', '').upper()
              for item in existing_response.json().get('certificates', [])
          }

          for cert_type, env_name in [('SHA_1', 'SHA1'), ('SHA_256', 'SHA256')]:
              value = os.environ[env_name].strip().upper()
              if value in existing:
                  print(f'{cert_type} signing certificate is already registered in Firebase.')
                  continue

              response = requests.post(
                  sha_url,
                  headers=headers,
                  json={'name': '', 'shaHash': value, 'certType': cert_type},
                  timeout=60,
              )
              if response.status_code == 409:
                  print(f'{cert_type} signing certificate already exists.')
              else:
                  response.raise_for_status()
                  print(f'Added {cert_type} signing certificate to Firebase Android app.')

          config_url = f'https://firebase.googleapis.com/v1beta1/{parent}/config'
          config_response = requests.get(config_url, headers=headers, timeout=60)
          config_response.raise_for_status()
          config_payload = config_response.json()
          config_bytes = base64.b64decode(config_payload['configFileContents'])
          config_path = Path('android/app/google-services.json')
          config_path.write_bytes(config_bytes)

          config = json.loads(config_bytes.decode('utf-8'))
          package_name = 'com.smartvision.faskhanista'
          clients = [
              client for client in config.get('client', [])
              if client.get('client_info', {}).get('android_client_info', {}).get('package_name') == package_name
          ]
          android_oauth_clients = [
              oauth
              for client in clients
              for oauth in client.get('oauth_client', [])
              if oauth.get('client_type') == 1
          ]

          if android_oauth_clients:
              print('Android OAuth client is present in refreshed google-services.json.')
          else:
              print('::warning::Firebase config still has no Android OAuth client. Google sign-in provider may need to be enabled for the Firebase project.')
          PY

      - name: Commit refreshed Firebase Android config
        shell: bash
        run: |
          if git diff --quiet -- android/app/google-services.json; then
            echo "Firebase Android config is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/google-services.json
          git commit -m "Refresh Android Firebase OAuth config [skip ci]"
          git push origin HEAD:main

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Fasakhansta-Test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fasakhansta-Test-APK
          path: Fasakhansta-Test.apk
          if-no-files-found: error
          retention-days: 14
