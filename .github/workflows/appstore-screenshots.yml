name: App Store Screenshots

on:
  push:
    paths:
      - '.github/workflows/appstore-screenshots.yml'
      - 'lib/app_store_screenshot_main.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure Flutter Web platform
        run: flutter create . --platforms web --no-pub

      - name: Configure Google Maps and Sign-In for Web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('web/index.html')
          html = index.read_text(encoding='utf-8')
          maps_script = '<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBDfirv6d7BiO-9YnsU5zCHEn9iM9iNtuM&libraries=places&language=ar&region=EG&v=weekly"></script>'
          google_signin_meta = '<meta name="google-signin-client_id" content="284797821306-sgmrmkr2ibd1nan66svmn9d3oq76vtj1.apps.googleusercontent.com">'
          additions = []
          if 'maps.googleapis.com/maps/api/js' not in html:
              additions.append(maps_script)
          if 'google-signin-client_id' not in html:
              additions.append(google_signin_meta)
          if additions:
              html = html.replace('</head>', '  ' + '\n  '.join(additions) + '\n</head>')
              index.write_text(html, encoding='utf-8')
          PY

      - name: Build screenshot web app
        run: |
          flutter build web --release \
            -t lib/app_store_screenshot_main.dart \
            --dart-define=GOOGLE_WEB_CLIENT_ID=284797821306-sgmrmkr2ibd1nan66svmn9d3oq76vtj1.apps.googleusercontent.com \
            --dart-define=FACEBOOK_APP_ID=997704678612295

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow

      - name: Serve web build
        run: |
          nohup python3 -m http.server 8080 --directory build/web >/tmp/fasakhansta-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fasakhansta-http.log
          exit 1

      - name: Capture ten iPhone screenshots
        run: |
          mkdir -p appstore_screenshots
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const routes = [
            ['01-home', 'BottomNavigationBarScreen'],
            ['02-restaurants', 'RestaurantsScreen'],
            ['03-competition', 'DrawRestaurantScreen'],
            ['04-search', 'SearchScreen'],
            ['05-wallet', 'WalletScreen'],
            ['06-delivery-request', 'RequestDelegateScreen'],
            ['07-favorites', 'FavoriteScreen'],
            ['08-cart', 'CartScreen'],
            ['09-contact-us', 'ContactUsScreen'],
            ['10-register', 'RegisterScreen'],
          ];

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 3,
            isMobile: true,
            hasTouch: true,
            locale: 'ar-EG',
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1',
          });

          const manifest = [];
          for (const [name, route] of routes) {
            const page = await context.newPage();
            const url = `http://127.0.0.1:8080/?route=${encodeURIComponent(route)}`;
            console.log(`Opening ${route}`);
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(route === 'BottomNavigationBarScreen' ? 14000 : 10000);
            try {
              const placeholder = page.locator('flt-semantics-placeholder');
              if (await placeholder.count()) await placeholder.first().click({ force: true });
            } catch (_) {}
            await page.waitForTimeout(1200);
            const path = `appstore_screenshots/${name}.png`;
            await page.screenshot({ path, fullPage: false });
            const size = fs.statSync(path).size;
            console.log(`${name}: ${size} bytes, ${await page.title()}`);
            manifest.push({ name, route, bytes: size });
            await page.close();
          }
          fs.writeFileSync('appstore_screenshots/manifest.json', JSON.stringify(manifest, null, 2));
          await browser.close();
          JS
          node capture.mjs
          file appstore_screenshots/*.png

      - name: Validate screenshot dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path('appstore_screenshots').glob('*.png'))
          assert len(files) == 10, f'Expected 10 screenshots, found {len(files)}'
          for path in files:
              with Image.open(path) as im:
                  print(path.name, im.size)
                  assert im.size == (1290, 2796), (path.name, im.size)
          PY

      - name: Create ZIP package
        run: zip -j Fasakhansta-AppStore-Screenshots-1290x2796.zip appstore_screenshots/*.png appstore_screenshots/manifest.json

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fasakhansta-AppStore-Screenshots-1290x2796
          path: |
            appstore_screenshots/*.png
            appstore_screenshots/manifest.json
            Fasakhansta-AppStore-Screenshots-1290x2796.zip
          if-no-files-found: error
          retention-days: 14
