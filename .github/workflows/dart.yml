name: Flutter Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix wallet inner clipping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/view/layout/home/widgets/home_wallet_card.dart')
          s = p.read_text()
          old = """        child: ClipRRect(\n          borderRadius: BorderRadius.circular(25),\n"""
          new = """        child: ClipRRect(\n          borderRadius: BorderRadius.zero,\n"""
          if old in s:
              p.write_text(s.replace(old, new, 1))
          else:
              print('Wallet inner clip already fixed or target not found.')
          PY

      - name: Commit wallet clip fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/view/layout/home/widgets/home_wallet_card.dart
          if git diff --cached --quiet; then
            echo 'No wallet clip change to commit.'
          else
            git commit -m 'Fix wallet clip hiding button corner'
            git push
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: customer-aab
          path: build/app/outputs/bundle/release/app-release.aab
