name: Flutter Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Apply wallet button redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/view/layout/home/widgets/home_wallet_card.dart')
          s = p.read_text()
          pattern = re.compile(r'class _WalletButton extends StatelessWidget \{.*\Z', re.S)
          replacement = r'''class _WalletButton extends StatelessWidget {
            final String title;
            final bool filled;
            final Color stitchColor;
            final IconData icon;
            final VoidCallback onTap;

            const _WalletButton({
              required this.title,
              required this.filled,
              required this.stitchColor,
              required this.icon,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              final radius = BorderRadius.circular(11);
              final background =
                  filled ? const Color(0xFFFF7A00) : const Color(0xFF1B1B1B);
              final foreground =
                  filled ? Colors.white : const Color(0xFFFFA31A);
              final borderColor =
                  filled ? const Color(0xFF111111) : const Color(0xFFFF8A00);

              return SizedBox(
                height: 38,
                child: Material(
                  color: Colors.transparent,
                  child: Ink(
                    decoration: BoxDecoration(
                      color: background,
                      borderRadius: radius,
                      border: Border.all(
                        color: borderColor,
                        width: filled ? 1.0 : 1.6,
                      ),
                      boxShadow: filled
                          ? const [
                              BoxShadow(
                                color: Color(0x33000000),
                                blurRadius: 3,
                                offset: Offset(0, 1),
                              ),
                            ]
                          : null,
                    ),
                    child: InkWell(
                      onTap: onTap,
                      borderRadius: radius,
                      child: Center(
                        child: Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 7),
                          child: FittedBox(
                            fit: BoxFit.scaleDown,
                            child: Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                Icon(icon, size: 13, color: foreground),
                                const SizedBox(width: 4),
                                Text(
                                  title,
                                  maxLines: 1,
                                  softWrap: false,
                                  style: AppTextStyle.text12BS().copyWith(
                                    color: foreground,
                                    fontSize: 9,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }
'''
          fixed, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Wallet button class not found')
          p.write_text(fixed)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/view/layout/home/widgets/home_wallet_card.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Redesign wallet buttons with solid outlines'
            git push
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: customer-aab
          path: build/app/outputs/bundle/release/app-release.aab
