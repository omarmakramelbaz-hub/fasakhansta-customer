name: Delegate Web Preview Deploy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/delegate-web-preview.yml"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Delegate Repository
        uses: actions/checkout@v4
        with:
          repository: omarmakramelbaz-hub/fasakhansta-driver
          ref: main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Flutter Web Platform
        run: flutter create . --platforms web --no-pub

      - name: Configure Google Maps for Web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('web/index.html')
          html = index.read_text(encoding='utf-8')
          maps_script = '<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBDfirv6d7BiO-9YnsU5zCHEn9iM9iNtuM&libraries=places&language=ar&region=EG&v=weekly"></script>'
          if 'maps.googleapis.com/maps/api/js' not in html:
              html = html.replace('</head>', f'  {maps_script}\n</head>')
              index.write_text(html, encoding='utf-8')
          PY

      - name: Build Delegate Web
        run: flutter build web --release

      - name: Configure Firebase Hosting
        run: |
          cat > firebase.json <<'JSON'
          {
            "hosting": {
              "public": "build/web",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [
                { "source": "**", "destination": "/index.html" }
              ]
            }
          }
          JSON
          cat > .firebaserc <<'JSON'
          {
            "projects": {
              "default": "fasakhaninjatest"
            }
          }
          JSON

      - name: Deploy Delegate Preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FASAKHANINJATEST }}'
          projectId: fasakhaninjatest
          channelId: delegate
          expires: 30d
