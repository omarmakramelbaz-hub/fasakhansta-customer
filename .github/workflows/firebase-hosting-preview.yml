name: Flutter Web Review Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Flutter Web platform
        run: flutter create . --platforms web --no-pub

      - name: Configure Google Maps and Sign-In for Web
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('web/index.html')
          html = index.read_text(encoding='utf-8')

          maps_script = '<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBDfirv6d7BiO-9YnsU5zCHEn9iM9iNtuM&libraries=places&language=ar&region=EG&v=weekly"></script>'
          google_signin_meta = '<meta name="google-signin-client_id" content="224648167390-efdtr7rjcnept7eiml1d642sdn8n9ki7.apps.googleusercontent.com">'

          additions = []
          if 'maps.googleapis.com/maps/api/js' not in html:
              additions.append(maps_script)
          if 'google-signin-client_id' not in html:
              additions.append(google_signin_meta)

          if additions:
              html = html.replace('</head>', '  ' + '\n  '.join(additions) + '\n</head>')
              index.write_text(html, encoding='utf-8')
          PY

      - name: Build Flutter Web
        run: |
          flutter build web --release \
            --dart-define=GOOGLE_WEB_CLIENT_ID=224648167390-efdtr7rjcnept7eiml1d642sdn8n9ki7.apps.googleusercontent.com \
            --dart-define=FACEBOOK_APP_ID=997704678612295

      - name: Add Meta policy pages
        run: |
          cat > build/web/privacy-policy.html <<'HTML'
          <!doctype html>
          <html lang="en" dir="ltr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Fasakhansta Privacy Policy</title>
            <style>
              body{font-family:Arial,sans-serif;max-width:860px;margin:40px auto;padding:0 20px;line-height:1.7;color:#222}h1,h2{color:#ff6f00}a{color:#d85e00}hr{border:0;border-top:1px solid #eee;margin:32px 0}.ar{direction:rtl;text-align:right}
            </style>
          </head>
          <body>
            <h1>Fasakhansta Privacy Policy</h1>
            <p>Last updated: August 28, 2026</p>
            <p>Fasakhansta uses account information to provide sign-in, account creation, ordering, delivery, support, and other app features. When you choose Facebook or Google sign-in, we may receive your name, email address, provider user ID, and profile image when available.</p>
            <h2>How we use information</h2>
            <p>We use information to authenticate users, create and manage accounts, provide requested services, communicate about orders or support, prevent abuse, and improve the service. We do not sell personal information to advertisers.</p>
            <h2>Sharing and retention</h2>
            <p>Information may be processed by service providers needed to operate the app and is retained only as long as necessary for account, legal, security, and operational purposes.</p>
            <h2>Your choices</h2>
            <p>You may request access, correction, or deletion of your account and associated personal information. See our <a href="/data-deletion.html">Data Deletion Instructions</a>.</p>
            <h2>Contact</h2>
            <p>For privacy questions, use our <a href="https://fasakhaninja.com/contact-us">Contact Us</a> page.</p>
            <hr>
            <div class="ar">
              <h1>سياسة الخصوصية - فسخانستا</h1>
              <p>آخر تحديث: 28 أغسطس 2026</p>
              <p>تستخدم فسخانستا بيانات الحساب لتوفير تسجيل الدخول وإنشاء الحساب والطلبات والتوصيل والدعم وباقي خدمات التطبيق. عند اختيار تسجيل الدخول عبر Facebook أو Google قد نستلم الاسم والبريد الإلكتروني ومعرّف المستخدم لدى مزود الخدمة وصورة الملف الشخصي عند توفرها.</p>
              <h2>استخدام البيانات</h2>
              <p>نستخدم البيانات لتأكيد هوية المستخدم وإدارة الحساب وتقديم الخدمات المطلوبة والتواصل بخصوص الطلبات أو الدعم ومنع إساءة الاستخدام وتحسين الخدمة. نحن لا نبيع البيانات الشخصية للمعلنين.</p>
              <h2>الحذف والحقوق</h2>
              <p>يمكنك طلب تصحيح أو حذف حسابك والبيانات المرتبطة به من خلال <a href="/data-deletion.html">تعليمات حذف البيانات</a>.</p>
              <h2>التواصل</h2>
              <p>لأي استفسار بخصوص الخصوصية استخدم صفحة <a href="https://fasakhaninja.com/contact-us">تواصل معنا</a>.</p>
            </div>
          </body>
          </html>
          HTML

          cat > build/web/terms.html <<'HTML'
          <!doctype html>
          <html lang="en" dir="ltr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Fasakhansta Terms of Service</title>
            <style>
              body{font-family:Arial,sans-serif;max-width:860px;margin:40px auto;padding:0 20px;line-height:1.7;color:#222}h1,h2{color:#ff6f00}a{color:#d85e00}hr{border:0;border-top:1px solid #eee;margin:32px 0}.ar{direction:rtl;text-align:right}
            </style>
          </head>
          <body>
            <h1>Fasakhansta Terms of Service</h1>
            <p>Last updated: August 28, 2026</p>
            <p>By using Fasakhansta you agree to provide accurate account information, use the service lawfully, and follow applicable ordering, payment, delivery, and marketplace rules shown in the app.</p>
            <h2>Accounts</h2>
            <p>You are responsible for activity on your account and for keeping your access credentials secure. Social sign-in is provided as an optional authentication method.</p>
            <h2>Orders and services</h2>
            <p>Availability, pricing, delivery areas, payment methods, promotions, and estimated times may vary and are shown in the app when relevant.</p>
            <h2>Acceptable use</h2>
            <p>You may not misuse the app, attempt unauthorized access, interfere with service operation, or use the service for unlawful activity.</p>
            <h2>Contact</h2>
            <p>Questions about these terms can be submitted through our <a href="https://fasakhaninja.com/contact-us">Contact Us</a> page.</p>
            <hr>
            <div class="ar">
              <h1>شروط استخدام فسخانستا</h1>
              <p>آخر تحديث: 28 أغسطس 2026</p>
              <p>باستخدام فسخانستا فإنك توافق على تقديم بيانات حساب صحيحة واستخدام الخدمة بصورة قانونية والالتزام بقواعد الطلب والدفع والتوصيل وأي شروط تظهر داخل التطبيق.</p>
              <h2>الحساب</h2>
              <p>أنت مسؤول عن النشاط الذي يتم من خلال حسابك وعن الحفاظ على أمان بيانات الدخول. تسجيل الدخول عبر الشبكات الاجتماعية هو وسيلة اختيارية لتسجيل الدخول.</p>
              <h2>الطلبات والخدمات</h2>
              <p>قد تختلف الأسعار والتوافر ومناطق التوصيل ووسائل الدفع والعروض والأوقات التقديرية، ويتم عرض التفاصيل المناسبة داخل التطبيق.</p>
              <h2>الاستخدام المقبول</h2>
              <p>لا يجوز إساءة استخدام التطبيق أو محاولة الوصول غير المصرح به أو تعطيل الخدمة أو استخدامها في نشاط غير قانوني.</p>
              <h2>التواصل</h2>
              <p>للاستفسارات استخدم صفحة <a href="https://fasakhaninja.com/contact-us">تواصل معنا</a>.</p>
            </div>
          </body>
          </html>
          HTML

          cat > build/web/data-deletion.html <<'HTML'
          <!doctype html>
          <html lang="en" dir="ltr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Fasakhansta Data Deletion Instructions</title>
            <style>
              body{font-family:Arial,sans-serif;max-width:860px;margin:40px auto;padding:0 20px;line-height:1.7;color:#222}h1,h2{color:#ff6f00}a{color:#d85e00}hr{border:0;border-top:1px solid #eee;margin:32px 0}.ar{direction:rtl;text-align:right}
            </style>
          </head>
          <body>
            <h1>Fasakhansta Data Deletion Instructions</h1>
            <p>You can request deletion of your Fasakhansta account and personal data at any time.</p>
            <h2>How to request deletion</h2>
            <p>Open our <a href="https://fasakhaninja.com/contact-us">Contact Us</a> page and submit a request titled <strong>Delete My Account</strong>. Include the phone number or email linked to your Fasakhansta account so we can verify the request.</p>
            <p>After verification, we will delete or anonymize account data that is not required to be retained for legal, security, fraud-prevention, accounting, or transaction-record obligations.</p>
            <p>You may also remove Fasakhansta from your Facebook account settings; this stops future Facebook access but does not by itself delete your Fasakhansta account. Use the deletion request above to request full account deletion.</p>
            <hr>
            <div class="ar">
              <h1>تعليمات حذف بيانات فسخانستا</h1>
              <p>يمكنك طلب حذف حساب فسخانستا وبياناتك الشخصية في أي وقت.</p>
              <h2>طريقة طلب الحذف</h2>
              <p>افتح صفحة <a href="https://fasakhaninja.com/contact-us">تواصل معنا</a> وأرسل طلبًا بعنوان <strong>حذف حسابي</strong>، مع كتابة رقم الهاتف أو البريد الإلكتروني المرتبط بالحساب حتى نتمكن من التحقق من الطلب.</p>
              <p>بعد التحقق نقوم بحذف أو إخفاء هوية البيانات التي لا يلزم الاحتفاظ بها لأسباب قانونية أو أمنية أو محاسبية أو لمنع الاحتيال أو حفظ سجلات المعاملات.</p>
              <p>يمكنك أيضًا إزالة فسخانستا من إعدادات حساب Facebook لإيقاف وصول Facebook مستقبلًا، لكن ذلك لا يحذف حساب فسخانستا تلقائيًا. استخدم طلب الحذف أعلاه لحذف الحساب والبيانات المرتبطة به.</p>
            </div>
          </body>
          </html>
          HTML

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FASAKHANINJATEST }}
          projectId: fasakhaninjatest
          channelId: live

# Only main may deploy the live review URL.
