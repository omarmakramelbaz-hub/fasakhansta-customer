name: Flutter Web Preview Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Flutter Web platform
        run: flutter create . --platforms web --no-pub

      - name: Configure Google Maps for Web
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('web/index.html')
          html = index.read_text(encoding='utf-8')
          maps_script = '<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBDfirv6d7BiO-9YnsU5zCHEn9iM9iNtuM"></script>'

          if 'maps.googleapis.com/maps/api/js' not in html:
              html = html.replace('</head>', f'  {maps_script}\n</head>')
              index.write_text(html, encoding='utf-8')
          PY

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FASAKHANINJATEST }}
          projectId: fasakhaninjatest
          channelId: live

# Only main is allowed to deploy the live review URL.
