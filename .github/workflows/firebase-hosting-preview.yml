name: Flutter Web Review Deploy

on:
  push:
    branches: [ "main", "fix/home-delivery-address-selector" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Flutter Web platform
        run: flutter create . --platforms web --no-pub

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FASAKHANINJATEST }}
          projectId: fasakhaninjatest
          channelId: live

# Redeploy trigger for the 18:38 review snapshot
