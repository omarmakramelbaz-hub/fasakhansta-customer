name: Fix Android App Icon Scale

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/fix-android-icon-scale.yml'

permissions:
  contents: write

jobs:
  fix_icon_scale:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Regenerate Android adaptive icon with safe area
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source_path = Path('assets/app_icon_master.png')
          source = Image.open(source_path).convert('RGBA')

          # Android adaptive icon layers are 108dp square. The visible artwork
          # must stay well inside the mask so launchers such as Samsung One UI
          # do not crop the fisherman/fish artwork.
          densities = {
              'mdpi': 108,
              'hdpi': 162,
              'xhdpi': 216,
              'xxhdpi': 324,
              'xxxhdpi': 432,
          }

          artwork_ratio = 0.70
          bg_color = (2, 12, 24, 255)

          for density, size in densities.items():
              artwork_size = int(round(size * artwork_ratio))
              artwork = source.resize((artwork_size, artwork_size), Image.Resampling.LANCZOS)

              foreground = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              offset = ((size - artwork_size) // 2, (size - artwork_size) // 2)
              foreground.alpha_composite(artwork, offset)

              background = Image.new('RGBA', (size, size), bg_color)

              for folder in [f'drawable-{density}', f'drawable-night-{density}']:
                  out_dir = Path('android/app/src/main/res') / folder
                  out_dir.mkdir(parents=True, exist_ok=True)
                  foreground.save(out_dir / 'ic_launcher_foreground.png', optimize=True)
                  background.save(out_dir / 'ic_launcher_background.png', optimize=True)

          print('Regenerated Android adaptive icons with 70% artwork scale and centered safe area.')
          PY

      - name: Commit corrected Android icons
        shell: bash
        run: |
          if git diff --quiet -- android/app/src/main/res; then
            echo "No icon changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res/drawable-*/ic_launcher_foreground.png
          git add android/app/src/main/res/drawable-*/ic_launcher_background.png
          git commit -m "Fix Android launcher icon scale and safe area"
          git push origin HEAD:main
