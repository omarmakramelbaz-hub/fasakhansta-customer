name: Fix wallet button stitch corner

on:
  push:
    branches: [main]
    paths:
      - 'lib/view/layout/home/widgets/home_wallet_card.dart'
      - '.github/workflows/fix-button-stitch-corner.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix wallet button stitch corner') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair button stitch geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/view/layout/home/widgets/home_wallet_card.dart')
          s = p.read_text()

          pattern = re.compile(r'class _ButtonEdgeStitchPainter extends CustomPainter \{.*?\n\}\n\nvoid _drawDashedPath\(', re.S)
          replacement = '''class _ButtonEdgeStitchPainter extends CustomPainter {
            final Color stitchColor;

            _ButtonEdgeStitchPainter({required this.stitchColor});

            @override
            void paint(Canvas canvas, Size size) {
              if (size.width <= 4 || size.height <= 4) return;

              const double inset = 0.65;
              const double buttonRadius = 12.0;
              final double radius = buttonRadius - inset;
              final rect = Rect.fromLTWH(
                inset,
                inset,
                size.width - inset * 2,
                size.height - inset * 2,
              );
              final path = Path()
                ..addRRect(
                  RRect.fromRectAndRadius(rect, Radius.circular(radius)),
                );

              final paint = Paint()
                ..style = PaintingStyle.stroke
                ..strokeCap = StrokeCap.round
                ..strokeJoin = StrokeJoin.round
                ..strokeWidth = 1.15
                ..color = stitchColor.withValues(alpha: .96);

              // Start halfway through a dash so every rounded corner receives
              // a balanced stitch instead of a visible gap at the corner.
              for (final metric in path.computeMetrics()) {
                const double dash = 4.2;
                const double gap = 3.6;
                const double phase = 1.8;
                var distance = -phase;
                while (distance < metric.length) {
                  final start = math.max(0, distance);
                  final end = math.min(distance + dash, metric.length);
                  if (end > start) {
                    canvas.drawPath(metric.extractPath(start, end), paint);
                  }
                  distance += dash + gap;
                }
              }
            }

            @override
            bool shouldRepaint(covariant _ButtonEdgeStitchPainter oldDelegate) {
              return oldDelegate.stitchColor != stitchColor;
            }
          }

          void _drawDashedPath('''

          fixed, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Button stitch painter block not found')
          p.write_text(fixed)
          PY

      - name: Commit repaired geometry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/view/layout/home/widgets/home_wallet_card.dart
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix wallet button stitch corner'
          git push
