name: Generate approved app icons

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate-approved-app-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate Android and iOS icons
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          master = Path('assets/app_icon_master.png')
          seed = Path('android/app/src/main/res/mipmap-xxxhdpi/launcher_icon.png')
          master.parent.mkdir(parents=True, exist_ok=True)

          # The approved high-resolution icon was placed in the Android icon slot
          # by the preceding commit. Preserve it as a permanent master before
          # generating platform-specific sizes.
          if not master.exists():
              Image.open(seed).convert('RGB').save(master, 'PNG', optimize=True)

          source = Image.open(master).convert('RGB')

          def save_rgb(path: Path, size: int):
              path.parent.mkdir(parents=True, exist_ok=True)
              source.resize((size, size), Image.Resampling.LANCZOS).save(path, 'PNG', optimize=True)

          # Android legacy launcher icon densities.
          android_sizes = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }
          for density, size in android_sizes.items():
              save_rgb(Path(f'android/app/src/main/res/mipmap-{density}/launcher_icon.png'), size)

          # Android adaptive icon layers. Use the approved icon as the complete
          # foreground and a matching dark navy backing layer. Update normal and
          # night resources so the icon never falls back to the previous artwork.
          adaptive_sizes = {
              'mdpi': 108,
              'hdpi': 162,
              'xhdpi': 216,
              'xxhdpi': 324,
              'xxxhdpi': 432,
          }
          navy = (2, 12, 24)
          for density, size in adaptive_sizes.items():
              fg = source.resize((size, size), Image.Resampling.LANCZOS)
              bg = Image.new('RGB', (size, size), navy)
              for prefix in ('drawable', 'drawable-night'):
                  folder = Path(f'android/app/src/main/res/{prefix}-{density}')
                  folder.mkdir(parents=True, exist_ok=True)
                  fg.save(folder / 'ic_launcher_foreground.png', 'PNG', optimize=True)
                  bg.save(folder / 'ic_launcher_background.png', 'PNG', optimize=True)

          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          adaptive_path = Path('android/app/src/main/res/mipmap-anydpi-v26/launcher_icon.xml')
          adaptive_path.write_text(adaptive_xml, encoding='utf-8')

          # iOS / iPadOS: generate every exact pixel size declared by the existing
          # asset catalog, including the 1024 px App Store marketing icon.
          catalog = Path('ios/Runner/Assets.xcassets/AppIcon.appiconset')
          data = json.loads((catalog / 'Contents.json').read_text(encoding='utf-8'))
          generated = set()
          for item in data.get('images', []):
              filename = item.get('filename')
              expected = item.get('expected-size')
              if not filename or not expected:
                  continue
              size = int(float(expected))
              key = (filename, size)
              if key in generated:
                  continue
              save_rgb(catalog / filename, size)
              generated.add(key)

          print(f'Generated {len(android_sizes)} Android legacy sizes, '
                f'{len(adaptive_sizes)} adaptive sizes (normal + night), '
                f'and {len(generated)} iOS asset entries.')
          PY

      - name: Commit generated icon assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app_icon_master.png \
            android/app/src/main/res \
            ios/Runner/Assets.xcassets/AppIcon.appiconset
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
            exit 0
          fi
          git commit -m "Generate approved app icons for Android and iOS"
          git push origin HEAD:main
