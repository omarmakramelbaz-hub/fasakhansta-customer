name: Generate approved app icons

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate-approved-app-icons.yml
      - assets/app_icon_source_192.b64.part*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate Android and iOS icons
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import base64
          import json

          parts = sorted(Path('assets').glob('app_icon_source_192.b64.part*'))
          if len(parts) != 4:
              raise RuntimeError(f'Expected 4 approved icon chunks, found {len(parts)}')

          encoded = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
          source = Image.open(BytesIO(base64.b64decode(encoded))).convert('RGB')
          source.load()

          master = Path('assets/app_icon_master.png')
          source.resize((1024, 1024), Image.Resampling.LANCZOS).save(master, 'PNG', optimize=True)

          def save_rgb(path: Path, size: int):
              path.parent.mkdir(parents=True, exist_ok=True)
              source.resize((size, size), Image.Resampling.LANCZOS).save(path, 'PNG', optimize=True)

          android_sizes = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }
          for density, size in android_sizes.items():
              save_rgb(Path(f'android/app/src/main/res/mipmap-{density}/launcher_icon.png'), size)

          adaptive_sizes = {
              'mdpi': 108,
              'hdpi': 162,
              'xhdpi': 216,
              'xxhdpi': 324,
              'xxxhdpi': 432,
          }
          navy = (2, 12, 24)
          for density, size in adaptive_sizes.items():
              fg = source.resize((size, size), Image.Resampling.LANCZOS)
              bg = Image.new('RGB', (size, size), navy)
              for prefix in ('drawable', 'drawable-night'):
                  folder = Path(f'android/app/src/main/res/{prefix}-{density}')
                  folder.mkdir(parents=True, exist_ok=True)
                  fg.save(folder / 'ic_launcher_foreground.png', 'PNG', optimize=True)
                  bg.save(folder / 'ic_launcher_background.png', 'PNG', optimize=True)

          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          Path('android/app/src/main/res/mipmap-anydpi-v26/launcher_icon.xml').write_text(
              adaptive_xml, encoding='utf-8'
          )

          catalog = Path('ios/Runner/Assets.xcassets/AppIcon.appiconset')
          data = json.loads((catalog / 'Contents.json').read_text(encoding='utf-8'))
          generated = set()
          for item in data.get('images', []):
              filename = item.get('filename')
              expected = item.get('expected-size')
              if not filename or not expected:
                  continue
              size = int(float(expected))
              key = (filename, size)
              if key in generated:
                  continue
              save_rgb(catalog / filename, size)
              generated.add(key)

          print(f'Generated {len(android_sizes)} Android launcher sizes, '
                f'{len(adaptive_sizes)} adaptive sizes for normal/night mode, '
                f'and {len(generated)} iOS icon files.')
          PY

      - name: Commit generated icon assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app_icon_master.png \
            android/app/src/main/res \
            ios/Runner/Assets.xcassets/AppIcon.appiconset
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
            exit 0
          fi
          git commit -m "Generate approved app icons for Android and iOS"
          git push origin HEAD:main
