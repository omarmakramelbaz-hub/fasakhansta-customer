name: Upload Drivers iOS to TestFlight

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/driver-release-trigger"

env:
  BUILD_NAME: "1.0.23"
  BUILD_NUMBER: "24"

permissions:
  contents: read

jobs:
  build_and_upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Verify required secrets
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_DRIVER_PROFILE_BASE64 }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          test -n "$P12" && test -n "$P12_PASSWORD" && test -n "$PROFILE"
          test -n "$API_KEY" && test -n "$API_KEY_ID" && test -n "$API_ISSUER"

      - name: Checkout Drivers repository
        run: git clone --depth 1 https://github.com/omarmakramelbaz-hub/fasakhansta-driver.git driver

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Prepare project
        working-directory: driver
        run: |
          set -euo pipefail
          grep -q '^version: 1.0.23+24$' pubspec.yaml
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.fasakhaninja.delegate;' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c 'Delete :aps-environment' ios/Runner/Runner.entitlements 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :aps-environment string production' ios/Runner/Runner.entitlements
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Install Apple signing assets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_DRIVER_PROFILE_BASE64: ${{ secrets.IOS_DRIVER_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/driver.p12"
          PROFILE="$RUNNER_TEMP/driver.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/driver.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$CERT"
          printf '%s' "$IOS_DRIVER_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          mkdir -p "$PROFILE_DIR"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          test "$APPID" = "4769DGYGT3.com.fasakhaninja.delegate"
          cp "$PROFILE" "$PROFILE_DIR/$UUID.mobileprovision"
          echo "DRIVER_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build unsigned Flutter release
        working-directory: driver
        run: flutter build ios --release --no-codesign --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Configure Runner-only signing
        working-directory: driver
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          raise 'Runner target not found' unless target
          target.build_configurations.each do |config|
            next unless config.name == 'Release'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['DEVELOPMENT_TEAM'] = '4769DGYGT3'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('DRIVER_PROFILE_NAME')
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]'] = ENV.fetch('DRIVER_PROFILE_NAME')
          end
          project.save
          puts "Runner profile: #{ENV.fetch('DRIVER_PROFILE_NAME')}"
          RUBY

      - name: Archive signed Drivers app
        working-directory: driver
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Drivers.xcarchive" archive

      - name: Export signed IPA
        working-directory: driver
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/DriversExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>destination</key><string>export</string>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>teamID</key><string>4769DGYGT3</string>
          <key>provisioningProfiles</key><dict>
          <key>com.fasakhaninja.delegate</key><string>${DRIVER_PROFILE_NAME}</string>
          </dict></dict></plist>
          PLIST
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Drivers.xcarchive" \
            -exportPath build/ios/ipa -exportOptionsPlist "$RUNNER_TEMP/DriversExportOptions.plist"
          IPA=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          echo "IPA_PATH=$PWD/$IPA" >> "$GITHUB_ENV"

      - name: Verify exported IPA
        working-directory: driver
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/verify"
          APP=$(find "$RUNNER_TEMP/verify/Payload" -maxdepth 1 -name '*.app' -print -quit)
          PLIST="$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.fasakhaninja.delegate"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "$BUILD_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$BUILD_NUMBER"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drivers-iOS-1.0.23-24
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Drivers build to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.private_keys"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$HOME/.private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Clean temporary signing files
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf "$HOME/.private_keys" || true
