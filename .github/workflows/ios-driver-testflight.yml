name: Upload Drivers iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: iOS version
        required: true
        default: '1.0.23'
      build_number:
        description: iOS build number
        required: true
        default: '24'

permissions:
  contents: read

jobs:
  build_and_upload:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Verify required secrets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_DRIVER_PROFILE_BASE64: ${{ secrets.IOS_DRIVER_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_P12_BASE64"
          test -n "$IOS_P12_PASSWORD"
          test -n "$IOS_DRIVER_PROFILE_BASE64"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64"

      - name: Checkout Drivers repository
        run: git clone --depth 1 https://github.com/omarmakramelbaz-hub/fasakhansta-driver.git driver

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Verify release metadata
        working-directory: driver
        run: |
          set -euo pipefail
          grep -q '^version: 1.0.23+24$' pubspec.yaml
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.fasakhaninja.delegate;' ios/Runner.xcodeproj/project.pbxproj

      - name: Prepare distribution entitlements
        working-directory: driver
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Delete :aps-environment' ios/Runner/Runner.entitlements 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :aps-environment string production' ios/Runner/Runner.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' ios/Runner/Runner.entitlements)" = "production"

      - name: Install Flutter dependencies
        working-directory: driver
        run: flutter pub get

      - name: Install iOS pods
        working-directory: driver/ios
        run: pod install --repo-update

      - name: Install Apple Distribution certificate and Drivers provisioning profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_DRIVER_PROFILE_BASE64: ${{ secrets.IOS_DRIVER_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/drivers_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/drivers.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/drivers-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_DRIVER_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$PROFILE_DIR"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/driver-profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/driver-profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/driver-profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/driver-profile.plist")

          test "$PROFILE_APP_ID" = "4769DGYGT3.com.fasakhaninja.delegate"
          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "DRIVER_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "Installed Drivers profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Prepare Flutter iOS release files
        working-directory: driver
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name='${{ inputs.build_name }}' \
            --build-number='${{ inputs.build_number }}'

      - name: Archive signed Drivers app
        working-directory: driver
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Drivers.xcarchive" \
            DEVELOPMENT_TEAM=4769DGYGT3 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$DRIVER_PROFILE_NAME" \
            MARKETING_VERSION='${{ inputs.build_name }}' \
            CURRENT_PROJECT_VERSION='${{ inputs.build_number }}' \
            archive

      - name: Export signed IPA
        working-directory: driver
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/DriversExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>4769DGYGT3</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.fasakhaninja.delegate</key>
              <string>${DRIVER_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Drivers.xcarchive" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/DriversExportOptions.plist"

          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          echo "IPA_PATH=$PWD/$IPA_PATH" >> "$GITHUB_ENV"
          ls -lh "$IPA_PATH"

      - name: Verify exported Drivers IPA
        working-directory: driver
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/drivers-ipa-verify"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_PATH=$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)
          PLIST="$APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.fasakhaninja.delegate"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "${{ inputs.build_name }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "${{ inputs.build_number }}"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drivers-iOS-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Drivers build to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.private_keys"
          API_KEY_PATH="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean temporary signing files
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf "$HOME/.private_keys" || true
