name: Repair wallet radius v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix radius type when needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/view/layout/home/widgets/home_wallet_card.dart')
          s = p.read_text()
          old = '    final radius = 26.0 - edgeInset;'
          new = '    final double radius = 26.0 - edgeInset;'
          if old not in s:
              print('Radius type already fixed; no changes needed.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/view/layout/home/widgets/home_wallet_card.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix wallet web radius type'
          git push