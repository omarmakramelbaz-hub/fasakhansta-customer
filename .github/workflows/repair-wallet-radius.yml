name: Repair wallet radius

on:
  push:
    branches: [main]
    paths:
      - 'lib/view/layout/home/widgets/home_wallet_card.dart'
      - '.github/workflows/repair-wallet-radius.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Repair wallet web build numeric radius type') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix radius type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/view/layout/home/widgets/home_wallet_card.dart')
          s = p.read_text()
          old = '    final radius = 26.0 - edgeInset;'
          new = '    final double radius = 26.0 - edgeInset;'
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/view/layout/home/widgets/home_wallet_card.dart
          git commit -m 'Repair wallet web build numeric radius type'
          git push